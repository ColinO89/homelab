---
- name: Install java and net-tools
  hosts: webserver
  tasks:
    - name: Update apt repo and cache
      apt: update_cache=yes force_apt_get=yes cache_valid_time=3600
    - name: Install java 17 and net tools
      apt:
        pkg:
          - openjdk-17-jre-headless
          - net-tools
- name: Download and unpack nexus installer
  hosts: webserver
  tasks:
    - name: Download nexus installer
      get_url:
        url: https://download.sonatype.com/nexus/3/nexus-3.95.3-02-linux-x86_64.tar.gz
        dest: /opt/
      register: download_result
    - debug:
        msg: "{{download_result}}"
    - name: Untar Nexus installer
      unarchive:
        src: "{{download_result.dest}}"
        dest: /opt/
        remote_src: yes
    - name: Find nexus folder
      find:
        paths: /opt/
        patterns: "nexus-*"
        file_type: directory
      register: nexus_folder
    - name: Rename nexus folder
      command:
        cmd: mv "{{ nexus_folder.files[0].path }}" /opt/nexus
        creates: /opt/nexus
      when: nexus_folder.files | length > 0

- name: Create nexus user and group
  hosts: webserver
  tasks:
    - name: Ensure nexus group exists
      group:
        name: nexus
        state: present
    - name: Create nexus user
      user:
        name: nexus
        group: nexus
    - name: Change ownership of nexus folder
      file:
        path: /opt/nexus
        state: directory
        owner: nexus
        group: nexus
        recurse: yes
    - name: Change ownership of sonatype-work folder
      file:
        path: /opt/sonatype-work
        state: directory
        owner: nexus
        group: nexus
        recurse: yes

- name: Start nexus with nexus user
  hosts: webserver
  become: yes
  become_user: nexus
  tasks:
    - name: Start run_as_user nexus
      lineinfile:
        path: /opt/nexus/bin/nexus.rc
        regexp: '^#?run_as_user=.*'
        line: 'run_as_user="nexus"'
    - name: Start nexus service
      command:
        cmd: /opt/nexus/bin/nexus start
      